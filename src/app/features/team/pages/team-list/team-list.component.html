<!-- teams-list.component.html -->
<section class="teams-page">
  <header class="section-header">
    <h2>Teams</h2>
  </header>

  <div *ngIf="loading" class="loader"></div>

  <div class="teams-grid" *ngIf="!loading">
    <a
      class="team-card"
      *ngFor="let t of teams"
      [routerLink]="['/teams', t.id]"
    >
      <h3>{{ t.name }}</h3>
      <p>{{ t.description }}</p>
    </a>
  </div>
</section>
