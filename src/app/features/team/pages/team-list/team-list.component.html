<section class="teams-grid-page">
  <h2>Equipos</h2>

  <div *ngIf="loading" class="loader">Cargando equipos…</div>

  <div class="grid" *ngIf="!loading">
    <div class="card" *ngFor="let team of pageItems()">
      <img
        [src]="imagePath(team.image)"
        (error)="onImageError($event)"
        alt="{{ team.name }}"
      />
      <h3>{{ team.name }}</h3>
      <a
        [routerLink]="['/teams', team.id]"
        [queryParams]="{ page: page }"
        class="btn-accent"
      >Ver equipo</a>
    </div>
  </div>

  <div class="pager">
    <button (click)="prevPage()" [disabled]="page === 1" class="btn-accent">←</button>
    <span>Página {{ page }} de {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="page === totalPages" class="btn-accent">→</button>
  </div>
</section>
