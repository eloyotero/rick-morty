<section class="team-detail" *ngIf="team">
  <button (click)="back()" class="btn-accent">← Volver</button>

  <img
    [src]="imagePath(team.image)"
    (error)="onImageError($event)"
    alt="{{ team.name }}"
  />

  <h1>{{ team.name }}</h1>
  <p>{{ team.description }}</p>
  <p *ngIf="team.created"><strong>Creado:</strong> {{ team.created }}</p>

  <h3>Miembros</h3>
  <ul><li *ngFor="let m of team.members">{{ m }}</li></ul>
</section>
