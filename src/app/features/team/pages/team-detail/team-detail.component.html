<section class="detail-page" *ngIf="team() as t">
  <button (click)="back()" class="btn-accent">← Volver</button>

  <img
    [src]="imagePath(t.image)"
    (error)="onImageError($event)"
    alt="{{ t.name }}"
    loading="lazy"
    width="240"
    height="240"
  />

  <h1>{{ t.name }}</h1>

  <h3>Miembros</h3>
  <ul>
    <li *ngFor="let m of t.members">{{ m }}</li>
  </ul>

  <h3>Episodios</h3>
  <ul>
    <li *ngFor="let ep of t.episodes">{{ ep }}</li>
  </ul>
</section>
