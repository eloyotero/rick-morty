<section class="detail-page" *ngIf="location() as loc">
  <button (click)="back()" class="btn-accent">← Volver</button>

  <img
    [src]="imagePath(loc.image)"
    (error)="onImageError($event)"
    alt="{{ loc.name }}"
    loading="lazy"
    width="240"
    height="240"
  />

  <h1>{{ loc.name }}</h1>
  <p>{{ loc.description }}</p>

  <h3>Episodios</h3>
  <ul>
    <li *ngFor="let ep of loc.episodes">{{ ep }}</li>
  </ul>
</section>
