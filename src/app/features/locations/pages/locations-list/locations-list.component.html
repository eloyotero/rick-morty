<!-- src/app/features/locations/pages/locations-list/locations-list.component.html -->
<section class="locations-page">
  <header class="section-header">
    <h2>Localizaciones</h2>
    <p>Explora dimensiones, planetas y lugares emblemáticos.</p>
  </header>

  <app-loader *ngIf="loading"></app-loader>

  <div class="grid" *ngIf="!loading">
    <a
      class="card"
      *ngFor="let l of locations"
      [routerLink]="['/locations', l.id]"
    >
      <div class="content">
        <h3>{{ l.name }}</h3>
        <p><strong>Tipo:</strong> {{ l.type }}</p>
        <p><strong>Dimensión:</strong> {{ l.dimension }}</p>
      </div>
    </a>
  </div>
</section>
