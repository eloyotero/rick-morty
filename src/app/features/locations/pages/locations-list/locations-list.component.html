<section class="locations-list">
  <header class="section-header">
    <h2>Localizaciones</h2>
  </header>

  <div class="locations-container">
    <div *ngFor="let loc of locations()" class="location-card">
      <div class="avatar-wrap">
        <img
          [src]="'assets/images/locations/' + (loc.image || 'placeholder.png')"
          [alt]="loc.name"
          class="location-thumb"
          loading="lazy"
          (error)="onImageError($event)"
        />
      </div>

      <div class="location-content">
        <h3 class="name">{{ loc.name }}</h3>
        <p><strong>Tipo:</strong> {{ loc.type }}</p>
        <p><strong>Dimensión:</strong> {{ loc.dimension }}</p>
        <p><strong>Episodio:</strong> {{ loc.episode }}</p>
        <p><strong>Residentes:</strong> {{ loc.residents.length }}</p>

        <button [routerLink]="['/locations', loc.id]" class="btn">
          Ver detalle
        </button>
      </div>
    </div>
  </div>
</section>
