<section class="list-page">
  <h1>Personajes</h1>

  <!-- Buscador -->
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Buscar personaje..."
    class="search-box"
  />

  <!-- Lista paginada -->
  <ul>
    <li *ngFor="let ch of filteredCharacters()">
      <a [routerLink]="['/characters', ch.id]" [queryParams]="{ page: currentPage }">
        <img
          [src]="imagePath(ch.image)"
          (error)="onImageError($event)"
          alt="{{ ch.name }}"
          loading="lazy"
        />
        <span>{{ ch.name }}</span>
      </a>
    </li>
  </ul>

  <!-- Paginación -->
  <div class="pagination">
    <button (click)="prevPage()" [disabled]="currentPage === 1">Anterior</button>
    <span>Página {{ currentPage }} de {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages">Siguiente</button>
  </div>
</section>
