<section class="detail-page" *ngIf="character() as ch">
  <button (click)="back()" class="btn-accent">← Volver</button>

  <img
    [src]="imagePath(ch.image)"
    (error)="onImageError($event)"
    alt="{{ ch.name }}"
    loading="lazy"
    width="240"
    height="240"
  />

  <h1>{{ ch.name }}</h1>
  <p>{{ ch.description }}</p>

  <h3>Episodios</h3>
  <ul>
    <li *ngFor="let ep of ch.episodes">{{ ep }}</li>
  </ul>
</section>
