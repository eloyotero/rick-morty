<!-- src/app/features/episodes/pages/episode-detail/episode-detail.component.html -->
<section class="detail-page" *ngIf="!loading && episode">
  <a routerLink="/episodes" class="back">← Volver</a>

  <div class="detail">
    <h2>{{ episode.name }}</h2>
    <p><strong>Fecha de emisión:</strong> {{ episode.air_date }}</p>
    <p><strong>Código:</strong> {{ episode.episode }}</p>
  </div>
</section>

<div *ngIf="loading" class="loader"></div>
