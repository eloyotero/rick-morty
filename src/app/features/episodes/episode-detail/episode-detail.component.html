<section class="episode-detail" *ngIf="episode">
  <button (click)="back()" class="btn-accent">← Volver</button>

  <h1>{{ episode.name }}</h1>
  <p><strong>Fecha:</strong> {{ episode.air_date }}</p>
  <p><strong>Código:</strong> {{ episode.episode }}</p>

  <h3>Personajes</h3>
  <ul><li *ngFor="let c of episode.characters">{{ c }}</li></ul>
</section>
