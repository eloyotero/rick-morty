
<section class="grid-page">
  <h2>Episodios</h2>

  <input
    type="text"
    placeholder="Buscar episodio..."
    [ngModel]="searchTerm()"
    (ngModelChange)="searchTerm.set($event)"
    class="search-bar"
  />

  <div *ngIf="loading()">Cargando episodios…</div>

  <div class="grid" *ngIf="!loading()">
    <div class="card" *ngFor="let ep of pageItems(); trackBy: trackById">
      <img [src]="imagePath(ep.image)" (error)="onImageError($event)" alt="{{ ep.title }}" />
      <h3>{{ ep.title }} ({{ ep.code }})</h3>
      <a [routerLink]="['/episodes', ep.id]" [queryParams]="{ page: page() }" class="btn-accent">
        Ver detalle
      </a>
    </div>
  </div>

  <div class="pagination-bar">
    <button (click)="prevPage()" [disabled]="page() === 1" class="btn-accent">← Anterior</button>
    <span>Página {{ page() }} de {{ totalPages() }}</span>
    <button (click)="nextPage()" [disabled]="page() === totalPages()" class="btn-accent">Siguiente →</button>
  </div>
</section>
