<!-- src/app/features/episodes/pages/episodes-list/episodes-list.component.html -->
<section class="episodes-page">
  <header class="section-header">
    <h2>Episodios</h2>
  </header>

  <div *ngIf="loading" class="loader"></div>

  <div class="episodes-grid" *ngIf="!loading">
    <a
      class="episode-card"
      *ngFor="let e of episodes"
      [routerLink]="['/episodes', e.id]"
    >
      <h3>{{ e.name }}</h3>
      <p><strong>Fecha:</strong> {{ e.air_date }}</p>
      <p><strong>Código:</strong> {{ e.episode }}</p>
    </a>
  </div>
</section>
