<section class="episodes-grid-page">
  <h2>Episodios</h2>

  <div *ngIf="loading" class="loader">Cargando episodios…</div>

  <div class="grid" *ngIf="!loading">
    <div class="card" *ngFor="let ep of pageItems()">
      <h3>{{ ep.name }}</h3>
      <p><strong>Fecha:</strong> {{ ep.air_date }}</p>
      <p><strong>Código:</strong> {{ ep.episode }}</p>
      <a [routerLink]="['/episodes', ep.id]" [queryParams]="{ page: page }" class="btn-accent">Ver episodio</a>
    </div>
  </div>

  <div class="pagination-bar">
    <button (click)="prevPage()" [disabled]="page === 1" class="btn-accent">Anterior</button>
    <span>Página {{ page }} de {{ totalPages }} ({{ totalItems }} {{ labelPlural }})</span>
    <button (click)="nextPage()" [disabled]="page === totalPages" class="btn-accent">Siguiente</button>
  </div>
</section>
