<!-- src/app/features/episodes/pages/episodes-list/episodes-list.component.html -->
<section class="episodes-page">
  <header class="section-header">
    <h2>Episodes</h2>
  </header>

  <div *ngIf="loading" class="loader">Cargando episodios…</div>

  <div class="episodes-grid" *ngIf="!loading">
    <a
      class="episode-card"
      *ngFor="let ep of episodes"
      [routerLink]="['/episodes', ep.id]"
    >
      <img
        src="assets/images/episode-placeholder.jpg"
        alt="Imagen del episodio {{ ep.name }}"
        class="episode-image"
      />

      <div class="episode-content">
        <h3 class="episode-title">{{ ep.name }}</h3>
        <p class="episode-meta"><strong>Fecha:</strong> {{ ep.air_date }}</p>
        <p class="episode-meta"><strong>Código:</strong> {{ ep.episode }}</p>
        <button class="episode-btn" type="button">Ver detalle</button>
      </div>
    </a>
  </div>

  <div class="empty" *ngIf="!loading && episodes.length === 0">
    No hay episodios para mostrar.
  </div>
</section>
