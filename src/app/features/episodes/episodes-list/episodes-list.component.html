<section class="episodes-page">
  <header class="section-header">
    <h2>Episodios</h2>
    <p>Explora las aventuras de Rick y Morty.</p>
  </header>

  <div *ngIf="loading" class="loader"></div>

  <div class="episodes-grid" *ngIf="!loading">
    <div class="episode-card" *ngFor="let episode of episodes">
      <div class="card-content">
        <h3>{{ episode.name }}</h3>
        <p><strong>Fecha de emisión:</strong> {{ episode.air_date }}</p>
        <p><strong>Código:</strong> {{ episode.episode }}</p>
      </div>
    </div>
  </div>
</section>
